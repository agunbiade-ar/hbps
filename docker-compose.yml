services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    depends_on:
      hayokbps:
        condition: service_healthy
    networks:
      - openmrs-distro-referenceapplication_default
    restart: always

  worker:
    build: ./backend
    container_name: worker
    command: ['python', 'worker.py']
    env_file:
      - ./backend/.env
    depends_on:
      hayokbps:
        condition: service_healthy
    networks:
      - openmrs-distro-referenceapplication_default
    restart: always

  frontend:
    build: ./frontend
    container_name: myapp_frontend
    ports:
      - '3000:3000'
    restart: always

  hayokbps:
    image: mysql:8
    container_name: hayokbps
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: hayokbps
    ports:
      - '9000:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      retries: 10
      timeout: 5s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
    restart: always
    networks:
      - openmrs-distro-referenceapplication_default

volumes:
  mysql_data:

networks:
  openmrs-distro-referenceapplication_default:
    external: true